# Bản thử trên GitHub Pages (PROJECT_RULES 4.4): build từ nhánh feat/... vừa đẩy, chạy test lõi,
# hiện "BẢN THỬ" + mã commit trên màn hình, rồi đẩy bản build vào nhánh gh-pages.
# Không chạm nhánh main. Bật một lần: Settings → Pages → Deploy from a branch → gh-pages / (root).
name: Bản thử GitHub Pages

on:
  push:
    branches: ["feat/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trial-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          PBTC_TRIAL: '1'
      - name: Đẩy bản build vào nhánh gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Bản thử từ ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
